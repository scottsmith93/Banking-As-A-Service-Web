name: Branch preview cleanup

# When a branch is deleted, remove matching Netlify deploy(s) so preview URLs stop working.
on:
  delete:

# Least privilege for GITHUB_TOKEN (CodeQL / supply-chain hygiene).
permissions:
  contents: read

jobs:
  cleanup:
    if: github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Remove Netlify deploys for deleted branch
        env:
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          DELETED_REF: ${{ github.event.ref }}
        run: |
          set -euo pipefail
          BRANCH="${DELETED_REF#refs/heads/}"
          case "$BRANCH" in
            main|master)
              echo "Skipping cleanup for protected branch: ${BRANCH}"
              exit 0
              ;;
          esac
          ALIAS="$(bash scripts/netlify-branch-alias.sh "$BRANCH")"
          echo "Removing Netlify preview deploys for branch '${BRANCH}' (alias '${ALIAS}')"
          bash scripts/delete-netlify-branch-deploys.sh \
            "${NETLIFY_SITE_ID}" \
            "${NETLIFY_AUTH_TOKEN}" \
            "${BRANCH}" \
            "${ALIAS}"
